<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT Studio | Portal Akses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0A0A0F;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: white;
            position: relative;
        }

        /* LED Glow Background */
        .led-bg {
            position: fixed; inset: 0; z-index: -1; overflow: hidden;
        }
        .led-bg::before {
            content: ""; position: absolute; width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(247, 127, 0, 0.1) 0%, transparent 70%);
            top: 10%; left: -50px; filter: blur(60px); animation: move 10s infinite alternate;
        }

        @keyframes move { 0% { transform: translate(0,0); } 100% { transform: translate(50px, 50px); } }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 40px 25px;
            width: 90%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px 0;
        }

        .btn-action {
            display: block; width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 15px;
            font-weight: 800; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; border: none;
        }

        .btn-login { background: linear-gradient(to right, #003566, #001d3d); color: white; }
        .btn-server { background: linear-gradient(to right, #F77F00, #d66d00); color: #000; }

        /* Modal Popup */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; z-index: 100;
            padding: 20px;
        }
        .modal-content {
            background: #121218; border: 1px solid #333; border-radius: 25px;
            padding: 30px; width: 100%; max-width: 340px; text-align: center;
        }
        .google-btn {
            background: white; color: black; display: flex; align-items: center; justify-content: center;
            gap: 12px; padding: 14px; border-radius: 12px; font-weight: 700; margin-top: 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="led-bg"></div>

    <div class="glass-card">
        <img src="images/txtstudio.png" alt="Logo" style="width: 120px; margin: 0 auto 20px auto; filter: drop-shadow(0 0 15px rgba(247, 127, 0, 0.4));">
        <h2 style="font-size: 22px; font-weight: 900; letter-spacing: 3px; margin-bottom: 30px;">TXT <span style="color: #F77F00;">STUDIO</span></h2>

        <button onclick="openModal()" class="btn-action btn-login">Proceed to Login</button>
        <button onclick="promptKey()" class="btn-action btn-server">Enter Server Key</button>

        <p style="font-size: 13px; color: #666; margin-top: 20px;">
            Forget Server Key? <a href="https://wa.me/601123456636" style="color: #F77F00;">Click Here</a>
        </p>
    </div>

    <!-- Modal Login -->
    <div id="loginModal" class="modal-overlay" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="font-weight: 800; margin-bottom: 10px;">SIGN IN</h3>
            <p style="font-size: 12px; color: #888; line-height: 1.5;">Pilih akaun Google anda untuk menyambung ke dashboard TXT Studio.</p>
            
            <div class="google-btn" onclick="simulasiLogin()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
                Continue with Google
            </div>

            <button onclick="closeModal()" style="margin-top: 25px; color: #555; font-size: 11px; font-weight: 700; text-transform: uppercase;">Batal</button>
        </div>
    </div>

    <script>
        function openModal() { document.getElementById('loginModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('loginModal').style.display = 'none'; }
        
        function simulasiLogin() {
            alert("Menyambung ke Google Play Services... Sila pilih email anda.");
            window.location.href = "home.html";
        }

        function promptKey() {
            let key = prompt("Sila masukkan Server Key (Ejen Sah):");
            if (key === "txtstudio") {
                window.location.href = "home.html";
            } else if (key != null) {
                alert("Key tidak sah.");
            }
        }
    </script>
</body>
</html>
