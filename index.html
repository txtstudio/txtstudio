<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT Studio | Portal Akses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0F; font-family: 'Inter', sans-serif; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; padding: 50px 25px; width: 90%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        
        .logo-img { width: 140px; margin: 0 auto 20px auto; filter: drop-shadow(0 0 15px rgba(247, 127, 0, 0.4)); }

        .btn-action { display: block; width: 100%; padding: 18px; margin-bottom: 15px; border-radius: 18px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; transition: 0.3s; letter-spacing: 1px; }
        .btn-login { background: linear-gradient(to right, #003566, #001d3d); color: white; border: 1px solid rgba(255,255,255,0.1); }
        .btn-server { background: linear-gradient(to right, #F77F00, #d66d00); color: #000; }
        .btn-action:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); opacity: 0.9; }

        input { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: white; width: 100%; padding: 16px; border-radius: 15px; margin-bottom: 15px; outline: none; text-align: center; }
        input:focus { border-color: #F77F00; background: rgba(255,255,255,0.12); }
        
        #loginSection { display: none; margin-top: 25px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Logo TXT STUDIO -->
        <img src="images/txtstudio.png" alt="TXT STUDIO" class="logo-img">
        
        <h2 class="text-2xl font-black tracking-widest mb-1 text-[#F77F00]">TXT STUDIO</h2>
        <p class="text-[10px] text-gray-500 uppercase mb-10 tracking-[4px]">Automated Provider</p>

        <!-- Menu Akses Sahaja -->
        <div id="mainMenu">
            <button onclick="showLogin()" class="btn-action btn-login text-xs">Admin / Agent Login</button>
            <button onclick="prosesServerKey()" class="btn-action btn-server text-xs">Enter Server Key</button>
        </div>

        <!-- Bahagian Login (Tersembunyi) -->
        <div id="loginSection">
            <input type="text" id="user" placeholder="Username / ID">
            <input type="password" id="pass" placeholder="Kata Laluan">
            <button onclick="prosesLogin()" class="btn-action btn-login text-xs">Sign In</button>
            <button onclick="backToMain()" class="text-[10px] text-gray-600 mt-2 hover:text-white uppercase tracking-widest font-bold">← Kembali</button>
        </div>

        <!-- Footer Contact -->
        <div class="mt-10 pt-6 border-t border-white/5">
            <p class="text-[10px] text-gray-600 mb-2 uppercase tracking-tighter">Masalah Akses? Hubungi Kami</p>
            <a href="https://wa.me/601123456636" class="inline-flex items-center gap-2 text-orange-500 font-bold text-xs hover:scale-105 transition-transform">
                <i class="fa fa-whatsapp"></i> CUSTOMER SUPPORT
            </a>
        </div>
    </div>

    <script>
        function showLogin() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
        
        function backToMain() {
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('loginSection').style.display = 'none';
        }

        function prosesServerKey() {
            let key = prompt("Sila masukkan Server Key (Ejen Sah):");
            // Ganti 'txtstudio' dengan key rahsia anda
            if (key === "txtstudio" || key === "TXT-VVIP-888") {
                window.location.href = "home.html";
            } else if (key != null) {
                alert("Server Key Tidak Sah!");
            }
        }

        function prosesLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            if(u === "admin" || u === "txtstudio") {
                window.location.href = "home.html";
            } else {
                alert("Akaun tidak ditemui. Sila guna Server Key.");
            }
        }
    </script>
</body>
</html>
