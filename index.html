<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT Studio | Portal Akses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0F; font-family: 'Inter', sans-serif; color: white; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; padding: 40px 25px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        
        /* Kesan Glow pada Logo */
        .logo-img { width: 120px; margin: 0 auto 15px auto; filter: drop-shadow(0 0 10px rgba(247, 127, 0, 0.5)); transition: 0.5s; }
        .logo-img:hover { transform: scale(1.05); filter: drop-shadow(0 0 20px rgba(247, 127, 0, 0.8)); }

        .btn-action { display: block; width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; border: none; transition: 0.3s; }
        .btn-login { background: linear-gradient(to right, #003566, #001d3d); color: white; }
        .btn-server { background: linear-gradient(to right, #F77F00, #d66d00); color: #000; }
        .btn-action:hover { transform: translateY(-3px); opacity: 0.9; }

        input, select { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); color: white; width: 100%; padding: 14px; border-radius: 12px; margin-bottom: 15px; outline: none; text-align: center; }
        input:focus { border-color: #F77F00; background: rgba(255,255,255,0.15); }
        
        #topupSection, #loginSection { display: none; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 25px; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="glass-card">
        <!-- Logo Cantik Anda Muncul Semula Di Sini -->
        <img src="images/txtstudio.png" alt="TXT STUDIO" class="logo-img">
        
        <h2 class="text-2xl font-black tracking-widest mb-1 text-[#F77F00]">TXT STUDIO</h2>
        <p class="text-[10px] text-gray-500 uppercase mb-8 tracking-[3px]">Automated Provider</p>

        <!-- Menu Utama -->
        <div id="mainMenu">
            <button onclick="showLogin()" class="btn-action btn-login text-xs">Admin / Agent Login</button>
            <button onclick="showTopup()" class="btn-action btn-server text-xs">Beli Topup Pantas</button>
        </div>

        <!-- Bahagian Login -->
        <div id="loginSection">
            <h3 class="text-sm font-bold mb-4 uppercase text-blue-400">Login Dashboard</h3>
            <input type="text" id="user" placeholder="Username / ID">
            <input type="password" id="pass" placeholder="Kata Laluan">
            <button onclick="prosesLogin()" class="btn-action btn-login text-xs">Sign In Sekarang</button>
            <button onclick="backToMain()" class="text-[10px] text-gray-500 mt-2 hover:text-white">← Kembali ke Menu</button>
        </div>

        <!-- Bahagian Topup -->
        <div id="topupSection">
            <h3 class="text-sm font-bold mb-4 text-[#F77F00] uppercase">Beli Topup (RM10 = RM10)</h3>
            <input type="number" id="phone" placeholder="Masukkan No Telefon">
            <select id="amount">
                <option value="5">RM 5.00 (Bayar RM5.00)</option>
                <option value="10" selected>RM 10.00 (Bayar RM10.00)</option>
                <option value="30">RM 30.00 (Bayar RM30.00)</option>
                <option value="50">RM 50.00 (Bayar RM50.00)</option>
            </select>
            <button onclick="prosesBeli()" class="btn-action bg-white text-black text-xs">WhatsApp Admin</button>
            <button onclick="backToMain()" class="text-[10px] text-gray-500 mt-2 hover:text-white">← Kembali ke Menu</button>
        </div>

        <p class="text-[11px] text-gray-700 mt-8">Perlukan Server Key? <a href="https://wa.me/601123456636" class="text-orange-500 font-bold">Klik Sini</a></p>
    </div>

    <script>
        function showLogin() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('loginSection').style.display = 'block';
        }
        function showTopup() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('topupSection').style.display = 'block';
        }
        function backToMain() {
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('topupSection').style.display = 'none';
        }

        function prosesLogin() {
            const u = document.getElementById('user').value;
            const p = document.getElementById('pass').value;
            // Login bypass untuk memudahkan anda masuk dashboard
            if(u === "txtstudio" || u === "admin") {
                window.location.href = "home.html";
            } else {
                alert("Username/Password Salah! Guna 'admin' untuk testing.");
            }
        }

        function prosesBeli() {
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            if(phone.length < 10) { alert("No telefon tidak sah!"); return; }
            const msg = `*ORDER BARU TXT STUDIO*%0A%0ANo Tel: ${phone}%0ANilai: RM${amount}%0ABayaran: RM${amount}.00%0A%0A_Sila lampirkan resit._`;
            window.open(`https://wa.me/601123456636?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
