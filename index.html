<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TXT Studio | Portal Akses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0A0A0F;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Kesan LED Bergerak ala IIMMPACT (Latar Belakang) */
        body::before {
            content: "";
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(247, 127, 0, 0.12) 0%, transparent 70%);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            filter: blur(80px);
            animation: moveLED 12s infinite alternate;
            z-index: -1;
        }

        body::after {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 53, 102, 0.15) 0%, transparent 70%);
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
            filter: blur(90px);
            animation: moveLED 18s infinite alternate-reverse;
            z-index: -1;
        }

        @keyframes moveLED {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(150px, 150px) scale(1.2); }
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            padding: 40px 20px;
            width: 90%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .logo-container {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            width: 130px; 
            height: 130px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px rgba(247, 127, 0, 0.5));
            image-rendering: -webkit-optimize-contrast;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 900;
            color: white;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .brand-name span {
            color: #F77F00;
        }

        .btn-action {
            display: block;
            width: 100%;
            padding: 18px;
            margin-bottom: 15px;
            border-radius: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-login {
            background: linear-gradient(to right, #003566, #001d3d);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .btn-server {
            background: linear-gradient(to right, #F77F00, #d66d00);
            color: #000;
        }

        .btn-server:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(247, 127, 0, 0.2);
        }

        .footer-link {
            margin-top: 25px;
            color: #888;
            font-size: 14px;
        }

        .footer-link a {
            color: #F77F00;
            text-decoration: none;
            font-weight: 600;
        }

        .version-text {
            position: absolute;
            bottom: 20px;
            color: #333;
            font-size: 11px;
            letter-spacing: 2px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="logo-container">
            <!-- Logo HD dari folder images -->
            <img src="images/txtstudio.png" alt="TXT Studio Logo" class="logo-img">
            <div class="brand-name">TXT <span>STUDIO</span></div>
        </div>

        <button onclick="location.href='auth.html'" class="btn-action btn-login">
            Proceed to Login
        </button>

        <button onclick="promptServerKey()" class="btn-action btn-server">
            Enter Server Key
        </button>

        <div class="footer-link">
            Forget Server Key? <a href="https://api.whatsapp.com/send?phone=601123456636&text=Bos%20saya%20lupa%20Server%20Key%20TXT%20Studio" target="_blank">Click Here</a>
        </div>
    </div>

    <div class="version-text">V 1.0.369 - TXT STUDIO OFFICIAL</div>

    <script>
        function promptServerKey() {
            let key = prompt("Sila masukkan Server Key (Ejen Sah Sahaja):");
            if (key === "txtstudio") {
                alert("Tahniah! Akses Ejen VIP diaktifkan. Harga komisyen tinggi akan dipaparkan.");
                window.location.href = "home.html?mode=vip";
            } else if (key != null) {
                alert("Key salah atau kosong. Anda akan masuk sebagai pelanggan biasa.");
                window.location.href = "home.html?mode=normal";
            }
        }
    </script>

</body>
</html>
