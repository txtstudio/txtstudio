<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TXT Studio | Portal Akses</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { background-color: #0A0A0F; font-family: 'Inter', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: white; }
        .glass-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px; padding: 40px 25px; width: 90%; max-width: 400px; text-align: center; }
        .btn-action { display: block; width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 15px; font-weight: 800; text-transform: uppercase; transition: 0.3s; cursor: pointer; border: none; }
        .btn-login { background: linear-gradient(to right, #003566, #001d3d); color: white; }
        .btn-server { background: linear-gradient(to right, #F77F00, #d66d00); color: #000; }
        input, select { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; width: 100%; padding: 12px; border-radius: 12px; margin-bottom: 15px; outline: none; }
        .hidden-section { display: none; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="glass-card">
        <h2 class="text-2xl font-black tracking-widest mb-2">TXT <span class="text-[#F77F00]">STUDIO</span></h2>
        <p class="text-[10px] text-gray-500 uppercase mb-8">Premium Topup Provider</p>

        <!-- Bahagian Login/Server Key -->
        <button onclick="window.location.href='auth.html'" class="btn-action btn-login text-xs">Admin / Agent Login</button>
        <button onclick="checkServerKey()" class="btn-action btn-server text-xs">Enter Server Key</button>

        <div class="border-t border-white/10 my-6 pt-6">
            <h3 class="text-orange-500 font-bold text-sm mb-4">BELI TOPUP PANTAS</h3>
            
            <!-- Langkah 1: Masukkan No Tel -->
            <label class="block text-[10px] text-gray-500 text-left ml-2 mb-1 uppercase font-bold">No. Telefon Pelanggan</label>
            <input type="number" id="phone" placeholder="Contoh: 0112345678" oninput="validatePhone()">

            <!-- Langkah 2: Muncul bila No Tel diisi -->
            <div id="topupSelection" class="hidden-section">
                <label class="block text-[10px] text-gray-500 text-left ml-2 mb-1 uppercase font-bold text-orange-400">Pilih Nilai Topup</label>
                <select id="amount">
                    <option value="5">RM 5.00 (Bayar RM5.00)</option>
                    <option value="10" selected>RM 10.00 (Bayar RM10.00)</option>
                    <option value="30">RM 30.00 (Bayar RM30.00)</option>
                    <option value="50">RM 50.00 (Bayar RM50.00)</option>
                </select>

                <button onclick="prosesBeli()" class="btn-action bg-white text-black mt-2">Beli Sekarang</button>
            </div>
        </div>

        <p class="text-[11px] text-gray-600 mt-4">Perlukan bantuan? <a href="https://wa.me/601123456636" class="text-orange-500 font-bold">WhatsApp Admin</a></p>
    </div>

    <script>
        // Fungsi untuk tunjukkan pilihan topup hanya jika no tel diisi (min 10 digit)
        function validatePhone() {
            const phone = document.getElementById('phone').value;
            const selection = document.getElementById('topupSelection');
            if (phone.length >= 10) {
                selection.style.display = 'block';
            } else {
                selection.style.display = 'none';
            }
        }

        // Fungsi Login Server Key
        function checkServerKey() {
            let key = prompt("Sila masukkan Server Key (Ejen Sah):");
            if (key === "txtstudio" || key === "TXT-VVIP-888") {
                window.location.href = "home.html";
            } else if (key != null) {
                alert("Key tidak sah!");
            }
        }

        // Fungsi Beli ke WhatsApp
        function prosesBeli() {
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const msg = `*ORDER BARU TXT STUDIO*%0A%0ANo Tel: ${phone}%0ANilai: RM${amount}%0ABayaran: RM${amount}%0A%0A_Sila lampirkan resit selepas transfer._`;
            window.open(`https://wa.me/601123456636?text=${msg}`, '_blank');
        }
    </script>
</body>
</html>
