<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard | TXT Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body { background-color: #0A0A0F; color: white; font-family: 'Inter', sans-serif; margin: 0; padding-bottom: 120px; }
        .glow-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px; }
        
        /* Kategori OTA Style - Dark Version */
        .category-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px 10px; text-align: center; transition: 0.3s; cursor: pointer; }
        .category-card:active { transform: scale(0.95); background: rgba(247, 127, 0, 0.1); }
        .category-icon { width: 50px; height: 50px; margin: 0 auto 12px; display: flex; align-items: center; justify-content: center; border-radius: 15px; font-size: 22px; background: rgba(247, 127, 0, 0.1); color: #F77F00; }
        
        /* Modal List Telco - Dark Version */
        .modal-telco { position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); display: none; align-items: flex-end; z-index: 1000; }
        .modal-content { background: #121218; width: 100%; border-radius: 35px 35px 0 0; padding: 30px; max-height: 85vh; overflow-y: auto; border-top: 2px solid #F77F00; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .telco-item { display: flex; flex-direction: column; align-items: center; padding: 12px; border-radius: 20px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
        .telco-item img { width: 55px; height: 55px; border-radius: 12px; margin-bottom: 10px; object-fit: cover; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .telco-item span { font-size: 10px; font-weight: 800; color: #ddd; text-align: center; }

        .nav-bottom { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10, 10, 15, 0.98); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; padding: 18px; z-index: 100; }
    </style>
</head>
<body>

    <!-- Header / Baki -->
    <div class="p-6 mb-4">
        <div class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-3">
                <img src="images/txtstudio.png" class="w-10 h-10 rounded-full border border-[#F77F00]/30 shadow-[0_0_15px_rgba(247,127,0,0.2)]">
                <div>
                    <h2 class="text-sm font-black tracking-tighter">TXT <span class="text-[#F77F00]">STUDIO</span></h2>
                    <p class="text-[9px] text-gray-500 uppercase tracking-widest font-bold">Master Admin</p>
                </div>
            </div>
            <div class="bg-orange-500 text-black px-4 py-1 rounded-full text-[9px] font-black uppercase tracking-tighter">RM 17,562.57</div>
        </div>

        <div class="glow-card p-6 bg-gradient-to-br from-orange-600/10 to-transparent border-[#F77F00]/20">
            <p class="text-[10px] text-gray-400 font-bold uppercase tracking-[0.2em] mb-1">Untung Hari Ini</p>
            <h1 class="text-3xl font-black text-green-400 italic tracking-tighter">+ RM 50.00</h1>
            <div class="mt-4 flex gap-2">
                <span class="bg-white/5 text-[9px] px-3 py-1 rounded-lg text-gray-400 font-bold">12 Ejen Aktif</span>
                <span class="bg-white/5 text-[9px] px-3 py-1 rounded-lg text-gray-400 font-bold">RM 0.50/RM10</span>
            </div>
        </div>
    </div>

    <!-- Main Categories Grid -->
    <div class="px-6 grid grid-cols-3 gap-3 mb-10">
        <div onclick="openTelco()" class="category-card">
            <div class="category-icon"><i class="fa fa-mobile"></i></div>
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-300">Topup</span>
        </div>
        <div class="category-card">
            <div class="category-icon" style="color: #00ccff; background: rgba(0,204,255,0.05);"><i class="fa fa-globe"></i></div>
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-300">Data</span>
        </div>
        <div class="category-card">
            <div class="category-icon" style="color: #ffcc00; background: rgba(255,204,0,0.05);"><i class="fa fa-barcode"></i></div>
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-300">Pin</span>
        </div>
        <div class="category-card">
            <div class="category-icon" style="color: #ff4d4d; background: rgba(255,77,77,0.05);"><i class="fa fa-file-text-o"></i></div>
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-300">Bill</span>
        </div>
        <div class="category-card">
            <div class="category-icon" style="color: #33ff99; background: rgba(51,255,153,0.05);"><i class="fa fa-plug"></i></div>
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-300">Utility</span>
        </div>
        <div class="category-card">
            <div class="category-icon" style="color: #cc66ff; background: rgba(204,102,255,0.05);"><i class="fa fa-gamepad"></i></div>
            <span class="text-[9px] font-black uppercase tracking-widest text-gray-300">Game</span>
        </div>
    </div>

    <!-- Modal Senarai 13 Telco (Dark Style) -->
    <div id="telcoModal" class="modal-telco" onclick="closeTelco()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-8">
                <h3 class="font-black text-sm tracking-widest text-[#F77F00]">PILIH OPERATOR</h3>
                <button onclick="closeTelco()" class="text-gray-500 text-xl"><i class="fa fa-times"></i></button>
            </div>
            
            <div class="grid grid-cols-3 gap-4 pb-10">
                <div onclick="proses('BeONE')" class="telco-item"><img src="images/beone.png"><span>BeONE</span></div>
                <div onclick="proses('Celcom')" class="telco-item"><img src="images/celcom.png"><span>Celcom</span></div>
                <div onclick="proses('Digi')" class="telco-item"><img src="images/digi.png"><span>Digi</span></div>
                <div onclick="proses('Eastel')" class="telco-item"><img src="images/eastel.png"><span>Eastel</span></div>
                <div onclick="proses('HaloTelco')" class="telco-item"><img src="images/halotelco.png"><span>HaloTelco</span></div>
                <div onclick="proses('Hotlink')" class="telco-item"><img src="images/hotlink.png"><span>Hotlink</span></div>
                <div onclick="proses('Njoi')" class="telco-item"><img src="images/njoi.png"><span>Njoi</span></div>
                <div onclick="proses('ONEXOX')" class="telco-item"><img src="images/onexox.png"><span>ONEXOX</span></div>
                <div onclick="proses('RedONE')" class="telco-item"><img src="images/redone.png"><span>RedONE</span></div>
                <div onclick="proses('TuneTalk')" class="telco-item"><img src="images/tunetalk.png"><span>TuneTalk</span></div>
                <div onclick="proses('UMobile')" class="telco-item"><img src="images/umobile.png"><span>UMobile</span></div>
                <div onclick="proses('Unifi')" class="telco-item"><img src="images/unifi.png"><span>Unifi</span></div>
                <div onclick="proses('Yes')" class="telco-item"><img src="images/yes.png"><span>Yes</span></div>
            </div>
        </div>
    </div>

    <!-- Nav Bawah -->
    <div class="nav-bottom">
        <div class="flex flex-col items-center text-[#F77F00]"><i class="fa fa-home text-xl"></i><span class="text-[9px] mt-1 font-black uppercase">Home</span></div>
        <div class="flex flex-col items-center text-gray-600"><i class="fa fa-exchange text-xl"></i><span class="text-[9px] mt-1 font-black uppercase">History</span></div>
        <div class="flex flex-col items-center text-gray-600"><i class="fa fa-user-circle-o text-xl"></i><span class="text-[9px] mt-1 font-black uppercase">Profile</span></div>
    </div>

    <script>
        function openTelco() { document.getElementById('telcoModal').style.display = 'flex'; }
        function closeTelco() { document.getElementById('telcoModal').style.display = 'none'; }
        function proses(nama) {
            let phone = prompt(`Masukkan No Telefon untuk ${nama}:`);
            if(phone) {
                let amount = prompt(`Masukkan Jumlah RM (Modal RM10=RM9.50):`);
                if(amount) {
                    window.open(`https://wa.me/601123456636?text=ORDER+TOPUP%0AProduk:+${nama}%0ANo:+${phone}%0AJumlah:+RM${amount}`, '_blank');
                }
            }
        }
    </script>
</body>
</html>
