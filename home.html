<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ejen | TXT Studio Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0A0A0F; color: white; font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh;
        }
        .glow-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px;
        }
        .icon-box {
            width: 60px; height: 60px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 8px; cursor: pointer;
        }
        #topupModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); display: none; align-items: flex-end; z-index: 200;
        }
        .modal-sheet {
            background: #121218; width: 100%; border-radius: 30px 30px 0 0;
            padding: 30px 20px; border-t: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%); transition: transform 0.3s ease-out;
        }
        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.95); border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; padding: 15px; z-index: 100;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <div class="p-6 flex justify-between items-center">
        <div>
            <h2 class="text-xl font-black tracking-tight">TXT <span class="text-orange-500">STUDIO</span></h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Premium Partner Portal</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center font-bold text-black border-2 border-white/10">VIP</div>
    </div>

    <!-- Balance Card -->
    <div class="px-6 mb-8">
        <div class="glow-card p-6 bg-gradient-to-br from-orange-600/20 to-transparent">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Baki Modal (Live OTA)</p>
            <!-- ID "balanceDisplay" digunakan untuk update baki dari API -->
            <h1 id="balanceDisplay" class="text-4xl font-black mt-2 text-white italic tracking-tighter">Memuatkan...</h1>
            <div class="flex gap-3 mt-6">
                <button class="flex-1 bg-orange-500 text-black py-3 rounded-xl font-black text-xs uppercase">Tambah Modal</button>
                <button class="flex-1 bg-white/10 py-3 rounded-xl font-black text-xs uppercase border border-white/5">Rekod</button>
            </div>
        </div>
    </div>

    <!-- Menu Grid -->
    <div class="px-6 mb-8">
        <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.3em] mb-4">Perkhidmatan Digital</h3>
        <div class="grid grid-cols-3 gap-y-6">
            <div class="flex flex-col items-center" onclick="openTopup()">
                <div class="icon-box bg-blue-500/10 text-blue-400 border border-blue-500/20"><i class="fa fa-mobile"></i></div>
                <span class="text-[11px] font-bold">TOPUP</span>
            </div>
            <div class="flex flex-col items-center" onclick="alert('Fungsi akan aktif selepas integrasi penuh.')">
                <div class="icon-box bg-orange-500/10 text-orange-400 border border-orange-500/20"><i class="fa fa-file-text-o"></i></div>
                <span class="text-[11px] font-bold">BIL</span>
            </div>
            <div class="flex flex-col items-center" onclick="alert('Fungsi akan aktif selepas integrasi penuh.')">
                <div class="icon-box bg-purple-500/10 text-purple-400 border border-purple-500/20"><i class="fa fa-gamepad"></i></div>
                <span class="text-[11px] font-bold">GAMES</span>
            </div>
        </div>
    </div>

    <!-- Navigation Bottom -->
    <div class="nav-bottom">
        <div class="flex flex-col items-center text-orange-500"><i class="fa fa-home text-xl"></i><span class="text-[9px] mt-1 font-bold">HOME</span></div>
        <div class="flex flex-col items-center text-gray-600"><i class="fa fa-exchange text-xl"></i><span class="text-[9px] mt-1 font-bold">HISTORY</span></div>
        <div class="flex flex-col items-center text-gray-600"><i class="fa fa-user-circle text-xl"></i><span class="text-[9px] mt-1 font-bold">PROFILE</span></div>
    </div>

    <!-- Script Integrasi API OTA -->
    <script>
        async function checkOTABalance() {
            const apiKey = "e9eac7ac-ec92-4302-a1b4-4d3f39c3d086";
            const url = "https://staging-api.otamy.net/v1/topup/balance";

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-api-key': apiKey,
                        'Content-Type': 'application/json'
                    }
                });
                const data = await response.json();
                if (data.amount !== undefined) {
                    document.getElementById('balanceDisplay').innerText = "RM " + parseFloat(data.amount).toFixed(2);
                } else {
                    document.getElementById('balanceDisplay').innerText = "RM 0.00";
                }
            } catch (error) {
                console.error("Gagal menarik baki OTA:", error);
                document.getElementById('balanceDisplay').innerText = "API ERROR";
            }
        }

        // Jalankan fungsi sebaik sahaja halaman dibuka
        window.onload = checkOTABalance;

        function openTopup() {
            alert('Integrasi Staging OTA Aktif!');
        }
    </script>
</body>
</html>
