<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Ejen | TXT Studio Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0A0A0F; color: white; font-family: 'Inter', sans-serif;
            margin: 0; padding: 0; overflow-x: hidden; position: relative; min-height: 100vh;
        }

        /* Kesan LED Bergerak Background */
        body::before {
            content: ""; position: absolute; width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(247, 127, 0, 0.1) 0%, transparent 70%);
            top: -50px; left: -50px; filter: blur(80px); animation: moveLED 10s infinite alternate; z-index: -1;
        }

        @keyframes moveLED { 0% { transform: translate(0, 0); } 100% { transform: translate(100px, 50px); } }

        .glow-card {
            background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 25px;
        }

        .icon-box {
            width: 60px; height: 60px; border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin-bottom: 8px; transition: all 0.3s ease; cursor: pointer;
        }

        .icon-box:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }

        /* Modal Styles */
        #topupModal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px); display: none; align-items: flex-end; z-index: 200;
        }

        .modal-sheet {
            background: #121218; width: 100%; border-radius: 30px 30px 0 0;
            padding: 30px 20px; border-t: 1px solid rgba(255,255,255,0.1);
            transform: translateY(100%); transition: transform 0.3s ease-out;
        }

        .nav-bottom {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; padding: 15px; z-index: 100;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header Section -->
    <div class="p-6 flex justify-between items-center">
        <div>
            <h2 class="text-xl font-black tracking-tight">TXT <span class="text-orange-500">STUDIO</span></h2>
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">Premium Partner Portal</p>
        </div>
        <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-orange-500 to-yellow-500 flex items-center justify-center font-bold text-black border-2 border-white/10">VIP</div>
    </div>

    <!-- Balance Card -->
    <div class="px-6 mb-8">
        <div class="glow-card p-6 bg-gradient-to-br from-orange-600/20 to-transparent relative overflow-hidden">
            <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">Baki Modal Tersedia</p>
            <h1 class="text-4xl font-black mt-2 text-white">RM 5,280.50</h1>
            <div class="flex gap-3 mt-6">
                <button class="flex-1 bg-orange-500 text-black py-3 rounded-xl font-black text-xs uppercase">Tambah Modal</button>
                <button class="flex-1 bg-white/10 py-3 rounded-xl font-black text-xs uppercase border border-white/5">Rekod</button>
            </div>
        </div>
    </div>

    <!-- Main Menu Grid -->
    <div class="px-6 mb-8">
        <h3 class="text-[10px] font-bold text-gray-500 uppercase tracking-[0.3em] mb-4">Perkhidmatan Digital</h3>
        <div class="grid grid-cols-3 gap-y-6">
            <!-- Topup Button - Now Functional -->
            <div class="flex flex-col items-center" onclick="openTopup()">
                <div class="icon-box bg-blue-500/10 text-blue-400 border border-blue-500/20 shadow-lg shadow-blue-500/5">
                    <i class="fa fa-mobile"></i>
                </div>
                <span class="text-[11px] font-bold">TOPUP</span>
            </div>
            <!-- Lain-lain button (Simulasi Alert) -->
            <div class="flex flex-col items-center" onclick="alert('Fungsi BIL akan diaktifkan tidak lama lagi.')">
                <div class="icon-box bg-orange-500/10 text-orange-400 border border-orange-500/20"><i class="fa fa-file-text-o"></i></div>
                <span class="text-[11px] font-bold">BIL</span>
            </div>
            <div class="flex flex-col items-center" onclick="alert('Fungsi GAMES akan diaktifkan tidak lama lagi.')">
                <div class="icon-box bg-purple-500/10 text-purple-400 border border-purple-500/20"><i class="fa fa-gamepad"></i></div>
                <span class="text-[11px] font-bold">GAMES</span>
            </div>
            <div class="flex flex-col items-center"><div class="icon-box bg-green-500/10 text-green-400 border border-green-500/20"><i class="fa fa-ticket"></i></div><span class="text-[11px] font-bold">PINS</span></div>
            <div class="flex flex-col items-center"><div class="icon-box bg-red-500/10 text-red-400 border border-red-500/20"><i class="fa fa-globe"></i></div><span class="text-[11px] font-bold">GLOBAL</span></div>
            <div class="flex flex-col items-center"><div class="icon-box bg-cyan-500/10 text-cyan-400 border border-cyan-500/20"><i class="fa fa-qrcode"></i></div><span class="text-[11px] font-bold">E-WALLET</span></div>
        </div>
    </div>

    <!-- TOPUP MODAL (Pilihan Telco) -->
    <div id="topupModal" onclick="closeTopup()">
        <div class="modal-sheet" id="modalSheet" onclick="event.stopPropagation()">
            <div class="w-12 h-1.5 bg-gray-700 rounded-full mx-auto mb-6"></div>
            <h3 class="text-xl font-black mb-6">PILIH TELCO</h3>
            <div class="grid grid-cols-4 gap-4 overflow-y-auto max-h-[400px]">
                <div class="text-center" onclick="alert('Celcom Selected')"><img src="images/celcom.png" class="w-full rounded-xl bg-white/5 p-2"></div>
                <div class="text-center" onclick="alert('Digi Selected')"><img src="images/digi.png" class="w-full rounded-xl bg-white/5 p-2"></div>
                <div class="text-center" onclick="alert('Maxis Selected')"><img src="images/hotlink.png" class="w-full rounded-xl bg-white/5 p-2"></div>
                <div class="text-center" onclick="alert('Umobile Selected')"><img src="images/umobile.png" class="w-full rounded-xl bg-white/5 p-2"></div>
                <!-- Tambah lagi mengikut keperluan -->
            </div>
            <button onclick="closeTopup()" class="w-full mt-8 py-4 bg-white/5 rounded-xl font-bold text-gray-400">TUTUP</button>
        </div>
    </div>

    <!-- Navigation Bottom -->
    <div class="nav-bottom">
        <div class="flex flex-col items-center text-orange-500"><i class="fa fa-home text-xl"></i><span class="text-[9px] mt-1 font-bold">HOME</span></div>
        <div class="flex flex-col items-center text-gray-600"><i class="fa fa-exchange text-xl"></i><span class="text-[9px] mt-1 font-bold">HISTORY</span></div>
        <div class="flex flex-col items-center text-gray-600"><i class="fa fa-user-circle text-xl"></i><span class="text-[9px] mt-1 font-bold">PROFILE</span></div>
    </div>

    <script>
        function openTopup() {
            const modal = document.getElementById('topupModal');
            const sheet = document.getElementById('modalSheet');
            modal.style.display = 'flex';
            setTimeout(() => { sheet.style.transform = 'translateY(0)'; }, 10);
        }

        function closeTopup() {
            const sheet = document.getElementById('modalSheet');
            sheet.style.transform = 'translateY(100%)';
            setTimeout(() => { document.getElementById('topupModal').style.display = 'none'; }, 300);
        }
    </script>
</body>
</html>
