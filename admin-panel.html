<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - TXT STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #000; color: #fff; }
        .glass-card { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .input-premium { background: #111 !important; border: 1px solid #333 !important; color: white; }
        .input-premium:focus { border-color: #f97316 !important; outline: none; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center">

    <div id="mainDashboard" class="w-full max-w-5xl">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-zinc-900/50 p-6 rounded-3xl border border-zinc-800">
            <div>
                <h1 class="text-2xl font-black text-orange-500">TXT STUDIO ADMIN</h1>
                <p class="text-[10px] text-zinc-500 tracking-widest uppercase">Ejen Mode: OTA MY Synchronized</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-zinc-500 uppercase">Untung Hari Ini</p>
                <h3 class="text-2xl font-black text-green-400" id="todayProfit">RM 0.00</h3>
            </div>
        </div>

        <!-- Borang -->
        <div class="glass-card p-8 rounded-[2rem]">
            <h2 class="text-lg font-bold mb-6 flex items-center"><i class="fa-solid fa- calculator mr-3 text-orange-500"></i> PROSES TOPUP & KIRA UNTUNG</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <div>
                    <label class="text-[10px] font-bold text-zinc-500 uppercase ml-2">No. Pelanggan</label>
                    <input type="text" id="custPhone" placeholder="011xxxxxxx" class="input-premium w-full p-4 rounded-2xl mt-1">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-zinc-500 uppercase ml-2">Produk</label>
                    <select id="custTelco" onchange="kiraUntungEjen()" class="input-premium w-full p-4 rounded-2xl mt-1 cursor-pointer">
                        <!-- data-profit = (Rate OTA MY - Rate Website) -->
                        <optgroup label="PREPAID (BEZA KOMISEN)">
                            <option value="UMOBILE" data-profit="0.30">UMOBILE (Ejen 0.30%)</option>
                            <option value="CELCOM" data-profit="0.30">CELCOM (Ejen 0.30%)</option>
                            <option value="DIGI" data-profit="0.10">DIGI (Ejen 0.10%)</option>
                            <option value="HOTLINK" data-profit="1.40">HOTLINK (Ejen 1.40%)</option>
                            <option value="TUNETALK" data-profit="0.90">TUNETALK (Ejen 0.90%)</option>
                            <option value="YES" data-profit="0.30">YES (Ejen 0.30%)</option>
                            <option value="REDONE" data-profit="0.80">REDONE (Ejen 0.80%)</option>
                            <option value="XOX" data-profit="0.20">XOX (Ejen 0.20%)</option>
                        </optgroup>
                        <optgroup label="BILL / GAMES">
                            <option value="BILL" data-profit="0.10" data-type="flat">BILL TNB/AIR (Ejen RM0.10)</option>
                            <option value="MLBB" data-profit="7.20">MLBB (Ejen 7.20%)</option>
                            <option value="PUBG" data-profit="3.20">PUBG (Ejen 3.20%)</option>
                        </optgroup>
                    </select>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-zinc-500 uppercase ml-2">Jumlah (RM)</label>
                    <input type="number" id="custAmount" oninput="kiraUntungEjen()" placeholder="0.00" class="input-premium w-full p-4 rounded-2xl mt-1 font-bold">
                </div>

                <div>
                    <label class="text-[10px] font-bold text-zinc-500 uppercase ml-2">Kiraan Untung Bersih</label>
                    <div class="bg-green-500/10 border border-green-500/20 p-4 rounded-2xl mt-1 text-center font-black text-green-400">
                        <span id="liveProfit">RM 0.00</span>
                    </div>
                </div>
            </div>

            <button onclick="prosesTransaksi()" id="btnProses" class="w-full mt-8 bg-orange-600 hover:bg-orange-500 py-5 rounded-2xl font-black text-white transition-all uppercase">HANTAR TOPUP SEKARANG</button>
        </div>
    </div>

    <script>
        // FUNGSI KIRA UNTUNG BERSIH ANDA (OTA MY - WEBSITE)
        function kiraUntungEjen() {
            const select = document.getElementById('custTelco');
            const opt = select.options[select.selectedIndex];
            const profitRate = parseFloat(opt.getAttribute('data-profit'));
            const type = opt.getAttribute('data-type');
            const amount = parseFloat(document.getElementById('custAmount').value) || 0;

            let untungAnda = 0;
            if (type === "flat") {
                untungAnda = amount > 0 ? profitRate : 0;
            } else {
                untungAnda = (amount * profitRate) / 100;
            }

            document.getElementById('liveProfit').innerText = `RM ${untungAnda.toFixed(2)}`;
            return untungAnda;
        }

        async function prosesTransaksi() {
            const profitNow = kiraUntungEjen();
            const btn = document.getElementById('btnProses');
            
            if(confirm("Proses transaksi?")) {
                btn.disabled = true;
                btn.innerText = "DIPROSES...";
                
                // Simulasi Berjaya (Sila sambung ke API anda)
                setTimeout(() => {
                    simpanUntung(profitNow);
                    updateUI();
                    btn.disabled = false;
                    btn.innerText = "HANTAR TOPUP SEKARANG";
                    alert("Berjaya! Untung RM" + profitNow.toFixed(2) + " direkodkan.");
                }, 1000);
            }
        }

        function simpanUntung(nilai) {
            const today = new Date().toDateString();
            let data = JSON.parse(localStorage.getItem('txt_profit')) || { date: today, total: 0 };
            if (data.date !== today) data = { date: today, total: nilai };
            else data.total += nilai;
            localStorage.setItem('txt_profit', JSON.stringify(data));
        }

        function updateUI() {
            const today = new Date().toDateString();
            const data = JSON.parse(localStorage.getItem('txt_profit')) || { date: today, total: 0 };
            document.getElementById('todayProfit').innerText = `RM ${data.total.toFixed(2)}`;
        }

        window.onload = updateUI;
    </script>
</body>
</html>
