<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - TXT STUDIO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white p-4">

    <div class="max-w-4xl mx-auto">
        <div class="flex justify-between items-center mb-8 bg-gray-800 p-4 rounded-xl border-l-4 border-orange-500">
            <div>
                <h1 class="text-xl font-bold uppercase">Admin Panel</h1>
                <p class="text-xs text-gray-400">Uruskan pesanan pelanggan secara manual</p>
            </div>
            <div class="text-right">
                <p class="text-xs">Status Server</p>
                <span class="text-green-500 font-bold text-xs uppercase">● Online</span>
            </div>
        </div>

        <!-- Kad Kawalan Cepat -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-gray-800 p-4 rounded-xl text-center border border-gray-700">
                <p class="text-gray-400 text-xs">Akaun Modal</p>
                <p class="text-lg font-bold text-orange-500" id="adminBalance">RM 0.00</p>
            </div>
            <div class="bg-gray-800 p-4 rounded-xl text-center border border-gray-700">
                <p class="text-gray-400 text-xs">Sistem API</p>
                <p class="text-lg font-bold text-green-500">OTA MY</p>
            </div>
        </div>

        <!-- Bahagian Input Proses Manual -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 mb-8">
            <h2 class="text-sm font-bold mb-4 uppercase text-gray-400">Borang Proses Topup (Selepas Terima Resit)</h2>
            <div class="space-y-4">
                <input type="text" id="custPhone" placeholder="No. Telefon Pelanggan" class="w-full bg-gray-700 border border-gray-600 p-3 rounded-lg focus:outline-none focus:border-orange-500">
                <div class="grid grid-cols-2 gap-4">
                    <select id="custTelco" class="bg-gray-700 border border-gray-600 p-3 rounded-lg">
                        <option value="CELCOM">CELCOM</option>
                        <option value="DIGI">DIGI</option>
                        <option value="MAXIS">MAXIS</option>
                        <option value="UMOBILE">UMOBILE</option>
                        <option value="TUNETALK">TUNETALK</option>
                    </select>
                    <input type="number" id="custAmount" placeholder="Jumlah (RM)" class="bg-gray-700 border border-gray-600 p-3 rounded-lg">
                </div>
                <button onclick="prosesTopupSekarang()" id="btnProses" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition duration-300">
                    <i class="fa-solid fa-bolt mr-2"></i> HANTAR TOPUP SEKARANG
                </button>
            </div>
        </div>

        <p class="text-center text-xs text-gray-600">TXT Studio Management v1.0</p>
    </div>

    <script>
        // Fungsi tarik baki OTA MY secara real
        async function getBalance() {
            try {
                const res = await fetch('/api/get-balance');
                const data = await res.json();
                document.getElementById('adminBalance').innerText = `RM ${parseFloat(data.balance).toFixed(2)}`;
            } catch (e) {
                document.getElementById('adminBalance').innerText = "OFFLINE";
            }
        }

        // Fungsi hantar arahan topup ke API OTA MY
        async function prosesTopupSekarang() {
            const phone = document.getElementById('custPhone').value;
            const telco = document.getElementById('custTelco').value;
            const amount = document.getElementById('custAmount').value;
            const btn = document.getElementById('btnProses');

            if (!phone || !amount) {
                alert("Sila isi maklumat pelanggan!");
                return;
            }

            const confirmMsg = `PENGESAHAN:\nHantar RM${amount} ke ${phone} (${telco})?\nPastikan DUIT SUDAH MASUK ke bank anda.`;
            
            if (confirm(confirmMsg)) {
                btn.disabled = true;
                btn.innerText = "Memproses...";
                
                try {
                    const response = await fetch('/api/recharge', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone, telco, amount })
                    });
                    
                    const data = await response.json();
                    
                    if (data.status === "SUCCESS") {
                        alert("BERJAYA! Topup sedang dihantar ke pelanggan.");
                        document.getElementById('custPhone').value = "";
                        getBalance();
                    } else {
                        alert("GAGAL: " + data.message);
                    }
                } catch (error) {
                    alert("Ralat Sistem! Sila semak baki OTA MY manual.");
                } finally {
                    btn.disabled = false;
                    btn.innerText = "HANTAR TOPUP SEKARANG";
                }
            }
        }

        // Jalankan bila page dibuka
        getBalance();
    </script>
</body>
</html>
